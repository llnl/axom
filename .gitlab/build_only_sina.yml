# As this is only to test Sina's ability to build with the defined set of
# requirements, I set it up (initially?) to only build as one combo, dane+llvm.

dane-llvm_sina-only:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /_qnone/ || $ON_DANE == "OFF" || $TEST_SINA == "OFF"'
      when: never
  variables:
    COMPILER: "llvm@19.1.3"
    HOST_CONFIG: "dane-toss_4_x86_64_ib-${COMPILER}.cmake"
    EXTRA_CMAKE_OPTIONS: "-DAXOM_ENABLE_ALL_COMPONENTS=OFF -DAXOM_ENABLE_SINA=ON"
  extends: .src_build_on_dane
